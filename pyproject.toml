[project]
name = "etm"
version = "0.1.0"
description = "Empirical Typhoon Model: 気象庁ベストトラックから台風の気圧・風速場を推算する"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0.1",
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
    "pandas>=2.2.3",
    "pyarrow>=20.0.0",
    "pyproj>=3.7.0",
    "scipy>=1.15.3",
    "shapely>=2.0.0",
]

[dependency-groups]
dev = [
    "contextily>=1.6.2",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.0",
    "keplergl>=0.3.7",
    "matplotlib-fontja>=1.1.0",
    "pytest>=8.0.0",
    "ruff>=0.11.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
